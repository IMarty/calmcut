name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Publie @calmcut/core, @calmcut/sync et @calmcut/phobias sur npm via Changesets.
# Désactivé tant que le scope npm @calmcut et le secret NPM_TOKEN n'existent pas :
# créer la variable de dépôt RELEASE_ENABLED = true pour l'activer.
jobs:
  release:
    name: version ou publication npm
    if: ${{ vars.RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # Publication npm avec provenance : la provenance lie la version publiée à
      # ce workflow et à ce commit, ce qui est vérifiable par les consommateurs.
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Changesets publie via npm : il faut Node en plus de Bun.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - name: Vérifier que rien d'interne ne fuite dans les paquets publiés
        run: bun run test

      - name: Build
        run: bun run build

      - uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run release
          commit: 'chore(release): publier les paquets'
          title: 'chore(release): version des paquets'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
