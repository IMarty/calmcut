name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement cible
        type: choice
        options: [preview, production]
        default: preview

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Le déploiement est désactivé tant que l'infrastructure Cloudflare n'existe pas.
# Pour l'activer : créer la variable de dépôt DEPLOY_ENABLED = true, une fois les
# secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID en place et les bases D1
# créées. Voir docs/mise-en-route.md, étape 4.
#
# Ce workflow ne déploie QUE ce qui existe. Les étapes du site (M5) et du cron (M7)
# seront ajoutées par les PR de leurs jalons respectifs : les écrire à l'avance
# ferait échouer le premier déploiement sur des dossiers sans configuration wrangler.
jobs:
  deploy:
    name: migrations D1 · API
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment || 'preview' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CALMCUT_ENV: ${{ inputs.environment || 'preview' }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Les migrations passent avant le déploiement : un Worker déployé contre un
      # schéma qui n'a pas encore migré échouerait sur chaque requête.
      - name: Migrations D1
        run: bun run --filter '@calmcut/db' migrate:${{ env.CALMCUT_ENV }}

      - name: Déployer l'API
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api
          command: deploy --env ${{ env.CALMCUT_ENV }}

      - name: Vérifier que l'API répond
        run: |
          # Un déploiement qui réussit mais dont le Worker ne démarre pas n'est pas
          # un déploiement réussi.
          test -n "${{ vars.API_HEALTH_URL }}" || { echo "API_HEALTH_URL non définie, vérification sautée"; exit 0; }
          curl --fail --silent --show-error --max-time 20 "${{ vars.API_HEALTH_URL }}" | tee /dev/stderr | grep -q '"ok":true'

  extension:
    name: artefact de l'extension
    if: ${{ vars.EXTENSION_BUILD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Builder Chrome et Firefox
        run: bun run --filter '@calmcut/extension' zip

      # La publication sur les stores reste une action manuelle d'Igor :
      # elle engage une identité d'éditeur et des délais de revue.
      - uses: actions/upload-artifact@v4
        with:
          name: calmcut-extension-${{ github.sha }}
          path: apps/extension/.output/*.zip
          if-no-files-found: error
          retention-days: 30
